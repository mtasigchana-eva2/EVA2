{% extends 'base/base.html' %}

{% block contenido %}
<div class="container mt-4">
    <h2>Editar Usuario</h2>
    <hr>

    <form method="POST">
        {% csrf_token %}

        {{ formulario.as_p }}

        <div class="mt-3">
            <button type="submit" class="btn btn-success">
                Guardar
            </button>
            <a href="{% url 'lista_usuarios' %}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>
    </form>
</div>
{% endblock %}
