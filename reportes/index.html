{% extends 'base/base.html' %}

{% block contenido %}

<h2 class="mb-4">
    📊 Reportes del Sistema
</h2>

<div class="row">

    <div class="col-md-4 mb-3">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <h5>👥 Usuarios</h5>
                <h2>{{ usuarios }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <h5>🎓 Carreras</h5>
                <h2>{{ carreras }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <h5>🏛 Sedes</h5>
                <h2>{{ sedes }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <h5>📦 Inventario</h5>
                <h2>{{ inventario }}</h2>
                <a href="{% url 'reporte_inventario' %}" class="btn btn-primary mt-2">
                    📦 Ver Reporte Inventario
                </a>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <h5>🛠 Herramientas</h5>
                <h2>{{ herramientas }}</h2>
            </div>
        </div>
    </div>

    <div class="col-md-4 mb-3">
        <div class="card shadow border-0">
            <div class="card-body text-center">
                <h5>📝 Solicitudes</h5>
                <h2>{{ solicitudes }}</h2>
            </div>
        </div>
    </div>

</div>

{% endblock %}
