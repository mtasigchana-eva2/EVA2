{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Correo Enviado | EVA2</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100 py-5">
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card shadow-sm border-0 rounded-3 text-center p-4 p-sm-5">
                    <div class="mb-3 text-success">
                        <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-envelope-check" viewBox="0 0 16 16">
                            <path d="M2 2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H2zm13 2v.5l-7 4.667L1 4.5V4h14zm0 11H2a1 1 0 0 1-1-1V6.25l6.803 4.535a.5.5 0 0 0 .539 0L15 6.25V14a1 1 0 0 1-1 1z"/>
                            <path d="M10.854 5.146a.5.5 0 0 1 0 .708l-3 3a.5.5 0 0 1-.708 0l-1.5-1.5a.5.5 0 1 1 .708-.708L7.5 7.793l2.646-2.647a.5.5 0 0 1 .708 0z"/>
                        </svg>
                    </div>
                    <h2 class="h4 card-title mb-3">¡Correo Enviado!</h2>
                    <p class="text-muted small mb-4">
                        Hemos enviado las instrucciones para restablecer tu contraseña a tu dirección de correo electrónico.
                    </p>
                    <p class="text-muted extra-small">
                        Si no recibes el correo en unos minutos, revisa tu carpeta de correo no deseado (spam).
                    </p>
                    <div class="mt-3">
                        <a href="{% url 'login' %}" class="btn btn-outline-primary w-100">
                            Volver al Inicio de Sesión
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
