{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <!-- Viewport corregido para forzar escala 1:1 en celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login SEMGA</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row w-100 justify-content-center">
        <!-- Reorganizado para celulares (col-11 / col-sm-8) y computadoras (col-md-5 col-lg-4) -->
        <div class="col-11 col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow border-0 rounded-3">
                <div class="card-body p-4">

                    <!-- ENCABEZADO CON LOGO Y TÍTULO -->
                    <div class="text-center mb-4">
                        <img
                            src="{% static 'images/logo_tecnoecuatoriano.png' %}"
                            alt="Instituto Superior Tecnológico Tecnoecuatoriano"
                            class="img-fluid"
                            style="max-width: 150px; height: auto; object-fit: contain;"
                        >

                        <h2 class="mt-3 mb-1 fw-bold">SEMGA</h2>

                        <p class="text-muted mb-0 small">
                            Sistema de Gestión Académica
                        </p>
                    </div>

                    <!-- FORMULARIO -->
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Correo institucional</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                name="username" 
                                placeholder="Correo institucional"
                                required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label text-secondary small">Contraseña</label>
                            <input 
                                type="password" 
                                class="form-control" 
                                name="password"
                                required>

                            <div class="text-end mt-2">
                                <a
                                    href="{% url 'password_reset' %}"
                                    class="text-decoration-none small"
                                >
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-success w-100">
                            Iniciar sesión
                        </button>
                        
                        <div class="text-center mt-3">
                            <button
                                type="button"
                                id="btnBiometrico"
                                class="btn btn-outline-primary w-100">
                                Ingresar con biometría
                            </button>
                        </div>

                    </form>

                    <hr class="my-4">
                    
                    <p class="text-center mb-0 small">
                        ¿No tienes cuenta? <a href="{% url 'registro' %}" class="text-decoration-none fw-bold">Crear cuenta</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'biometria/js/login_principal.js' %}"></script>
</body>

</html>
