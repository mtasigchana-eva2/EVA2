{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login EVA2</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-body">

                    <!-- ENCABEZADO CON LOGO Y TÍTULO -->
                    <div class="text-center mb-4">
                        <img
                            src="{% static 'images/logo_tecnoecuatoriano.png' %}"
                            alt="Instituto Superior Tecnológico Tecnoecuatoriano"
                            style="width: 170px; height: 170px; object-fit: contain;"
                        >

                        <h2 class="mt-3 mb-1">EVA2</h2>

                        <p class="text-muted mb-0">
                            Sistema de Gestión Académica
                        </p>
                    </div>

                    <!-- FORMULARIO -->
                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label>Correo institucional</label>
                            <input 
                                type="text" 
                                class="form-control" 
                                name="username" 
                                placeholder="Correo institucional">
                        </div>

                        <div class="mb-3">
                            <label>Contraseña</label>
                            <input 
                                type="password" 
                                class="form-control" 
                                name="password">

                            <div class="text-end mt-2">
                                <a
                                    href="{% url 'password_reset' %}"
                                    class="text-decoration-none"
                                >
                                    ¿Olvidaste tu contraseña?
                                </a>
                            </div>
                        </div>

                        <button class="btn btn-success w-100">
                            Iniciar sesión
                        </button>
                        
                        <br>
                        <div class="text-center mt-3">
                            <button
                                type="button"
                                id="btnBiometrico"
                                class="btn btn-outline-primary w-100">
                                Ingresar con biometría
                            </button>
                        </div>

                    </form>

                    <hr>
                    
                    <p class="text-center mb-0">
                        ¿No tienes cuenta? <a href="{% url 'registro' %}">Crear cuenta</a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="{% static 'biometria/js/login_principal.js' %}"></script>
</body>

</html>
