{% extends 'base/base.html' %}

{% block contenido %}

<div class="container mt-4">

    <h2>Nueva Solicitud de Herramienta</h2>

    <hr>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {{ formulario.as_p }}

        <button type="submit" class="btn btn-success">

            Guardar

        </button>

        <a href="{% url 'lista_solicitudes_herramientas' %}" class="btn btn-secondary">

            Cancelar

        </a>

    </form>

</div>

{% endblock %}
