{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>Ingreso Biométrico - EVA2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#f5f7fa;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card-login{

            width:720px;

            border:none;

            border-radius:15px;

            box-shadow:0px 0px 25px rgba(0,0,0,.15);

        }

        video{

            border-radius:10px;

            border:3px solid #0d6efd;

        }

    </style>

</head>

<body>

<div class="card card-login">

    <div class="card-body text-center">

        <h2>EVA2</h2>

        <p class="text-muted">

            Ingreso Biométrico

        </p>

        <hr>

        <div class="mb-3">

            <input

                id="username"

                class="form-control"

                placeholder="Ingrese su usuario">

        </div>

        <video

            id="video"

            width="640"

            height="480"

            autoplay

            playsinline>

        </video>

        <canvas

            id="canvas"

            width="640"

            height="480"

            style="display:none">

        </canvas>

        <br><br>

        <button

            id="ingresar"

            class="btn btn-success btn-lg">

            Ingresar con biometría

        </button>

        <br><br>

        <a href="/"

           class="btn btn-outline-secondary">

            Volver al login

        </a>

    </div>

</div>

<script src="{% static 'biometria/js/login.js' %}"></script>

</body>

</html>
